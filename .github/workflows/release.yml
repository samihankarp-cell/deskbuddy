name: Release

# Push a tag like v0.1.0: the tests run, DeskBuddy.exe is built on Windows, zipped with the
# browser add-on, and attached to a GitHub release whose notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Check the tag matches the package version
        run: |
          version=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
      - name: Build DeskBuddy.exe
        run: uv run --with pyinstaller python scripts/build_exe.py
      - name: Zip it
        run: |
          name="DeskBuddy-${GITHUB_REF_NAME}-windows-x64.zip"
          (cd dist && 7z a -tzip -mx=7 "../$name" DeskBuddy > /dev/null)
          sha256sum "$name" > "$name.sha256"
          echo "ZIP=$name" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: uv run python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --title "Desk Buddy $GITHUB_REF_NAME" --notes-file notes.md
