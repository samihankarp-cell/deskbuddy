[project]
name = "deskbuddy"
version = "0.1.0"
description = "A small desktop robot for Windows that does what you tell it, by voice or typing, in your browser, your apps and your files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["desktop-assistant", "ai-agent", "windows", "voice", "automation", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
authors = [
    { name = "samihan karpe", email = "samihankarp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "composio>=0.32.0",
    "faster-whisper>=1.2.1",
    "keyboard>=0.13.5",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "mcp>=1.9,<2",
    "numpy>=2.5.4",
    "pillow>=11",
    "pyautogui>=0.9.54",
    "pyside6-essentials>=6.12.0",
    "python-dotenv>=1.2.4",
    "pywinauto>=0.6.9",
    "send2trash>=2.1.0",
    "sounddevice>=0.5.6",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://github.com/samihankarp-cell/deskbuddy"
Issues = "https://github.com/samihankarp-cell/deskbuddy/issues"
Changelog = "https://github.com/samihankarp-cell/deskbuddy/blob/main/CHANGELOG.md"

[project.scripts]
deskbuddy = "deskbuddy.app:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]
